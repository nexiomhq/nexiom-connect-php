name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        dependencies: [highest]
        include:
          - php: "8.2"
            dependencies: lowest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Check
        if: matrix.dependencies == 'highest'
        run: composer check

      # PHPStan targets the newest Guzzle types, so the lowest set runs the tests only.
      - name: Test
        if: matrix.dependencies == 'lowest'
        run: composer test

  release-version:
    name: Release tag matches VERSION
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          php -r '
            require "src/NexiomConnect.php";
            $tag = getenv("RELEASE_TAG");
            if (!preg_match("/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/", $tag)) {
                fwrite(STDERR, "Release tag must be a stable version such as v0.1.0\n");
                exit(1);
            }
            if ($tag !== "v" . Nexiom\Connect\NexiomConnect::VERSION) {
                fwrite(STDERR, "Version mismatch: VERSION=" . Nexiom\Connect\NexiomConnect::VERSION . ", tag=$tag\n");
                exit(1);
            }
          '
